name: NexPulse CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    name: Backend Pytest & Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Backend Tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-32-characters-minimum
          AI_ENABLED: "true"
          AI_API_KEY: ""
        run: |
          cd backend
          pytest -v

  demo-app-tests:
    name: Demo App Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd demo-app
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Demo App Tests
        run: |
          cd demo-app
          pytest -v

  frontend-tests-and-build:
    name: Frontend Vitest & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Unit Tests
        run: |
          cd frontend
          npm test

      - name: Build Production Frontend
        run: |
          cd frontend
          npm run build
